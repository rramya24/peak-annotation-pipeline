# MultiQC config file for nf-core/multistep-peak-annotation

report_comment: >
  This report has been generated by the <a href="https://github.com/rramya24/peak-annotation-pipeline" target="_blank">nf-core/multistep-peak-annotation</a>
  pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/rramya24/peak-annotation-pipeline" target="_blank">documentation</a>.

report_section_order:
  "nf-core-multistep-peak-annotation-methods-description":
    order: -1000
  "nf-core-multistep-peak-annotation-summary":
    order: -1001

export_plots: true

# Custom content for peak annotation pipeline
custom_content:
  order:
    - peak_consensus_stats
    - crm_intersection_stats
    - intron_intersection_stats
    - homer_annotation_stats

# Module search patterns for peak annotation tools
sp:
  bedtools:
    fn: "*.bedtools.log"
  homer:
    fn: "*annotatePeaks.txt"
    contents: "Peak"
  consensus_peaks:
    fn: "*consensus.log"

# Custom plot configs
custom_plot_config:
  peak_consensus_plot:
    title: "Peak Consensus Statistics"
    description: "Number of consensus peaks called from replicates"
    ylab: "Number of peaks"

  annotation_plot:
    title: "Peak Annotation Distribution"
    description: "Distribution of peaks across genomic features"
    ylab: "Percentage of peaks"

# Remove modules not relevant to peak annotation
remove_sections:
  - fastqc_sequence_counts
  - fastqc_sequence_duplication_levels

# Report title and intro
title: "nf-core/multistep-peak-annotation"
subtitle: "Multi-step peak annotation pipeline for ChIP-seq and DamID-seq data"
intro_text: >
  This pipeline performs comprehensive annotation of ChIP-seq and DamID-seq peaks using consensus calling,
  CRM intersection, intron intersection, and HOMER annotation for Drosophila melanogaster (dm6).

# Table configuration
table_columns_visible:
  general_stats:
    total_peaks: True
    consensus_peaks: True
    crm_overlaps: True
    intron_overlaps: True
    annotated_peaks: True

# Custom CSS for pipeline branding (optional)
custom_css: |
  .mqc-header h1 {
    color: #2E8B57;
  }

  .mqc-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
