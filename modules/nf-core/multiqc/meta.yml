name: multiqc
description: Aggregate results from bioinformatics analyses across many samples into a single report
keywords:
  - QC
  - report
  - HTML
tools:
  - multiqc:
      description: |
        MultiQC searches a given directory for analysis logs and compiles a HTML report.
        It's a general use tool, perfect for summarising the output from numerous bioinformatics tools.
      homepage: https://multiqc.info/
      documentation: https://multiqc.info/docs/
      licence: ["GPL-3.0-or-later"]
input:
  - multiqc_files:
      type: file
      description: |
        List of reports / files recognised by MultiQC, see https://multiqc.info/docs/#supported-tools
      pattern: "*"
  - multiqc_config:
      type: file
      description: Optional config yml for MultiQC
      pattern: "*.{yml,yaml}"
  - extra_multiqc_config:
      type: file
      description: Second optional config yml for MultiQC. Will override common sections in multiqc_config.
      pattern: "*.{yml,yaml}"
  - multiqc_logo:
      type: file
      description: Optional logo file for MultiQC
      pattern: "*.{png,jpg,jpeg}"
output:
  - report:
      type: file
      description: MultiQC report file
      pattern: "*multiqc_report.html"
  - data:
      type: directory
      description: MultiQC data directory
      pattern: "*_data"
  - plots:
      type: directory
      description: Plots created by MultiQC
      pattern: "*_plots"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@abhi18av"
  - "@bunop"
  - "@drpatelh"
  - "@jfy133"
maintainers:
  - "@abhi18av"
  - "@bunop"
  - "@drpatelh"
  - "@jfy133"

# END OF SCRIPT
